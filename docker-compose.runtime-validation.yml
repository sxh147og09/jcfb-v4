services:
  postgres:
    image: postgres:16-alpine
    container_name: jcfb-v4-disposable-pg
    environment:
      POSTGRES_DB: ${JCFB_V4_RUNTIME_DB:-jcfb_v4_runtime}
      POSTGRES_USER: ${JCFB_V4_RUNTIME_OWNER:-jcfb_v4_runtime_owner}
      POSTGRES_PASSWORD: ${JCFB_V4_RUNTIME_PASSWORD:?Set JCFB_V4_RUNTIME_PASSWORD in the local environment}
    ports:
      # Host exposure is loopback-only; the container port remains PostgreSQL's 5432.
      - "127.0.0.1:55432:5432"
    volumes:
      # Relative bind mounts resolve from this repository, so disposable
      # PostgreSQL data is kept under F:\Projects\jcfb-v4\.runtime\postgres.
      - type: bind
        source: ./.runtime/postgres
        target: /var/lib/postgresql/data
      # The local compatibility role is provisioned only by PostgreSQL's
      # first-time disposable initialization, then verified by candidate 0001.
      - type: bind
        source: ./database/runtime/0000_service_role.sql
        target: /docker-entrypoint-initdb.d/0000_service_role.sql
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 3s
      timeout: 3s
      retries: 20
    restart: "no"
    networks:
      - jcfb-v4-local-only

networks:
  jcfb-v4-local-only:
    # A project-scoped bridge is required for Docker Desktop to materialize
    # the loopback host publish. Isolation is provided by the project network,
    # loopback-only binding, ephemeral credentials, and the Production gate.
    driver: bridge
