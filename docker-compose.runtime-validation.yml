services:
  postgres:
    image: postgres:16-alpine
    container_name: jcfb-v4-disposable-pg
    environment:
      POSTGRES_DB: ${JCFB_V4_RUNTIME_DB:-jcfb_v4_runtime}
      POSTGRES_USER: ${JCFB_V4_RUNTIME_OWNER:-jcfb_v4_runtime_owner}
      POSTGRES_PASSWORD: ${JCFB_V4_RUNTIME_PASSWORD:?Set JCFB_V4_RUNTIME_PASSWORD in the local environment}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - jcfb-v4-disposable-pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 3s
      timeout: 3s
      retries: 20
    restart: "no"
    networks:
      - jcfb-v4-local-only

networks:
  jcfb-v4-local-only:
    internal: true

volumes:
  jcfb-v4-disposable-pg-data:
    name: jcfb-v4-disposable-pg-data
